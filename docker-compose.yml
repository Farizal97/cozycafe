services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cozycafe}
      DB_USERNAME: ${DB_USERNAME:-cozycafe}
      DB_PASSWORD: ${DB_PASSWORD:-cozycafe}
      DB_CHARSET: utf8mb4
    volumes:
      - ./storage:/var/www/html/storage
      - ./backups:/var/www/html/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cozycafe}
      MYSQL_USER: ${DB_USERNAME:-cozycafe}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cozycafe}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cozycafe_root}
    volumes:
      - cozycafe_mysql:/var/lib/mysql
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-cozycafe_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  cozycafe_mysql:
